name: CI pipeline

permissions:
  contents: read
  
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
 
jobs:
  build-and-test-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  
      - name: Configure
        run:
           cmake --preset gcc-make-debug

      - name: Build
        run:
           cmake --build --preset gcc-make-debug-build
      
      - name: Launch unit tests in Debug
        run:
           ctest --preset unit-tests-ci-gcc-debug

  build-and-test-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run:
           cmake --preset gcc-make-release

      - name: Build
        run:
           cmake --build --preset gcc-make-release-build
      
      - name: Launch unit tests in Release
        run:
           ctest --preset unit-tests-ci-gcc-release
    